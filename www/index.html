<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0A1C13" />
  <title>Vasukii AR</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="vendor/model-viewer.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">Vasukii<span class="dot"></span></div>
    <div class="tag">AR preview &middot; test build</div>
  </header>

  <main>
    <section class="stage">
      <model-viewer id="viewer"
        alt="3D preview of the selected plant"
        camera-controls auto-rotate auto-rotate-delay="1500" rotation-per-second="18deg"
        touch-action="pan-y" interaction-prompt="none"
        shadow-intensity="1" shadow-softness="0.9" exposure="1.05"
        camera-orbit="25deg 78deg auto" min-camera-orbit="auto 20deg auto"
        ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" ar-placement="floor">
        <button slot="ar-button" id="webArBtn" hidden></button>
        <div class="loading" id="loading">Loading plant&hellip;</div>
      </model-viewer>
      <div class="dims" id="dims"></div>
    </section>

    <section class="panel">
      <div class="row">
        <h2 id="plantName">Plant</h2>
        <span class="latin" id="plantLatin"></span>
      </div>
      <p class="blurb" id="plantBlurb"></p>
      <div class="care"><span id="careLight"></span><span id="careWater"></span></div>

      <div class="label">Choose plant</div>
      <div class="chips" id="plantChips"></div>

      <div class="label">Pot colour</div>
      <div class="swatches" id="potSwatches"></div>

      <div class="label">Size</div>
      <div class="seg" id="sizeSeg"></div>
    </section>
  </main>

  <footer class="cta">
    <button id="arBtn" class="ar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>
      View in your space
    </button>
    <div class="hint" id="hint">Point at the floor, tap to place. Pinch to resize.</div>
  </footer>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
